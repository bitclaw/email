name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Wait for Mailpit
        run: until curl -sf http://localhost:8025/livez > /dev/null; do sleep 1; done
      - run: bun run lint
      - run: bun run knip
      - run: bun run typecheck
      - run: bun test
